name: Objava na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dopustenja koja treba akcija za objavu na Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Istovremeno smije teci samo jedna objava; nove cekaju da prethodna zavrsi.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Pages servira projekt na /<ime-repozitorija>/, pa build mora znati putanju.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
